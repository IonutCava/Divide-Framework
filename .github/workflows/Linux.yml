name: Linux Builds

on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: 'Runner type to run on (GitHub or Self Hosted)'
        required: false
        default: 'GitHub'
        type: choice
        options:
        - GitHub
        - self-hosted
      ci_sha:
        description: 'Commit selected by the daily scheduler'
        required: true
        type: string
      ci_target:
        description: 'master or pr-N'
        required: true
        type: string

run-name: Linux Build - ${{ inputs.ci_target }} - ${{ inputs.ci_sha }}

permissions:
  contents: read

jobs:
  info_job:
    name: Ubuntu latest - Print Info
    runs-on: ${{ github.event.inputs.runner_type == 'self-hosted' && fromJson('["self-hosted","Linux"]') || 'ubuntu-24.04' }}

    steps:
    - name: Print GCC version
      run: g++ --version 

    - name: Print CLANG version
      run: clang --version 

  build_gcc:
    needs: info_job
    name: Ubuntu latest - gcc ${{ matrix.build-type }} ${{ matrix.configuration }}
    runs-on: ${{ github.event.inputs.runner_type == 'self-hosted' && fromJson('["self-hosted","Linux"]') || 'ubuntu-24.04' }}
    strategy:
      fail-fast: true
      matrix:
        build-type: [editor, game]
        configuration: [debug, release, profile]
    timeout-minutes: 240
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/build-setup/linux
        with:
          runner_type: ${{ github.event.inputs.runner_type || 'GitHub' }}

      - uses: ./.github/actions/cmake-build/linux
        with:
          compiler: gcc
          build-type: ${{ matrix.build-type }}
          configuration: ${{ matrix.configuration }}

  build_clang:
    needs: info_job
    name: Ubuntu latest - clang ${{ matrix.build-type }} ${{ matrix.configuration }}
    runs-on: ${{ github.event.inputs.runner_type == 'self-hosted' && fromJson('["self-hosted","Linux"]') || 'ubuntu-24.04' }}
    strategy:
      fail-fast: true
      matrix:
        build-type: [editor, game]
        configuration: [debug, release]
    timeout-minutes: 240
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/build-setup/linux
        with:
          runner_type: ${{ github.event.inputs.runner_type || 'GitHub' }}

      - uses: ./.github/actions/cmake-build/linux
        with:
          compiler: clang
          build-type: ${{ matrix.build-type }}
          configuration: ${{ matrix.configuration }}

  build_clang_asan_ubsan:
    needs: [info_job, build_gcc, build_clang]
    name: Ubuntu - clang ASAN+UBSAN (debug/editor)
    runs-on: ${{ github.event.inputs.runner_type == 'self-hosted' && fromJson('["self-hosted","Linux"]') || 'ubuntu-24.04' }}
    timeout-minutes: 240
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/build-setup/linux
        with:
          runner_type: ${{ github.event.inputs.runner_type || 'GitHub' }}

      - uses: ./.github/actions/cmake-build/linux
        with:
          compiler: clang
          build-type: editor
          configuration: debug
          configure-preset: linux-clang-editor-asan-ubsan
          build-preset: linux-clang-debug-editor-asan-ubsan
          test-preset: test-linux-clang-debug-editor-asan-ubsan

  build_gcc_asan_ubsan:
    needs: [info_job, build_gcc, build_clang]
    name: Ubuntu - gcc ASAN+UBSAN (debug/editor)
    runs-on: ${{ github.event.inputs.runner_type == 'self-hosted' && fromJson('["self-hosted","Linux"]') || 'ubuntu-24.04' }}
    timeout-minutes: 240
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/build-setup/linux
        with:
          runner_type: ${{ github.event.inputs.runner_type || 'GitHub' }}

      - uses: ./.github/actions/cmake-build/linux
        with:
          compiler: gcc
          build-type: editor
          configuration: debug
          configure-preset: linux-gcc-editor-asan-ubsan
          build-preset: linux-gcc-debug-editor-asan-ubsan
          test-preset: test-linux-gcc-debug-editor-asan-ubsan

  output_job:
    needs: [info_job, build_gcc, build_clang, build_clang_asan_ubsan, build_gcc_asan_ubsan]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Report commit status
        uses: actions/github-script@v7
        env:
          CI_SHA: ${{ inputs.ci_sha }}
          CI_TARGET: ${{ inputs.ci_target }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const success = Object.values(JSON.parse(process.env.JOB_RESULTS)).every(job => job.result === 'success');
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.CI_SHA,
              context: `daily-ci/linux/${process.env.CI_TARGET}`,
              state: success ? 'success' : 'failure',
              description: success ? 'Daily build passed' : 'Daily build did not complete successfully',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Retrieve results
        id: results
        run: |
          if [[ "${{ needs.build_gcc.result }}" == "failure" || "${{ needs.build_clang.result }}" == "failure" || "${{ needs.build_clang_asan_ubsan.result }}" == "failure" || "${{ needs.build_gcc_asan_ubsan.result }}" == "failure" ]]; then
            echo "status=Build failed" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.build_gcc.result }}" == "cancelled" || "${{ needs.build_clang.result }}" == "cancelled" || "${{ needs.build_clang_asan_ubsan.result }}" == "cancelled" || "${{ needs.build_gcc_asan_ubsan.result }}" == "cancelled" ]]; then
            echo "status=Builds cancelled" >> $GITHUB_OUTPUT
          else
            echo "status=Success" >> $GITHUB_OUTPUT
          fi

      - name: Report Status
        run: echo "${{ steps.results.outputs.status }}"

      - name: Fail workflow on cancelled/failed dependency jobs
        if: ${{ steps.results.outputs.status != 'Success' }}
        run: |
          echo "One or more required jobs did not complete successfully: ${{ steps.results.outputs.status }}"
          exit 1
