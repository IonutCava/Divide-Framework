name: Windows Builds

on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      validation_only:
        description: 'Run only the canonical MSVC Debug/editor instrumentation build and tests'
        required: false
        default: false
        type: boolean
      runner_type:
        description: 'Runner type to run on (GitHub or Self Hosted)'
        required: false
        default: 'GitHub'
        type: choice
        options:
        - GitHub
        - self-hosted

run-name: Windows Build - ${{ github.ref_name }} - ${{ github.event.inputs.runner_type || 'GitHub' }}

jobs:
  check_date:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v5
        with:
         fetch-depth: 1
         submodules: false
      - id: check
        uses: ./.github/actions/check-date

  info_job:
    needs: check_date
    if: ${{ needs.check_date.outputs.should_run != 'false' && !inputs.validation_only }}

    name: Windows latest - Print Info
    runs-on: ${{ github.event.inputs.runner_type == 'self-hosted' && fromJson('["self-hosted","Windows"]') || 'windows-latest' }}

    outputs:
      msvc_version: ${{ steps.msvc.outputs.msvc_version }}
      clang_version: ${{ steps.clang.outputs.clang_version }}

    steps:
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Print MSVC version
      id: msvc
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $msvcVersion = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
        if ([string]::IsNullOrWhiteSpace($msvcVersion)) { throw 'Unable to determine MSVC installation version from vswhere.' }
        "msvc_version=$msvcVersion" >> $env:GITHUB_OUTPUT

    - name: Print CLANG version
      id: clang
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $vsInstallDir = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if ([string]::IsNullOrWhiteSpace($vsInstallDir)) { throw 'Unable to determine Visual Studio installation path from vswhere.' }
        $clangPath = Join-Path $vsInstallDir 'VC\Tools\Llvm\x64\bin\clang.exe'
        if (-not (Test-Path $clangPath)) { throw "clang.exe not found at '$clangPath'." }
        $clangVersion = (& $clangPath --version | Select-Object -First 1)
        "clang_version=$clangVersion" >> $env:GITHUB_OUTPUT

  build_msvc:
    needs: info_job
    name: Windows - msvc ${{ matrix.build-type }} ${{ matrix.configuration }}
    runs-on: ${{ github.event.inputs.runner_type == 'self-hosted' && fromJson('["self-hosted","Windows"]') || 'windows-latest' }}
    strategy:
      fail-fast: true
      matrix:
        build-type: [editor, game]
        configuration: [debug, release, profile]

    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/build-setup/windows
        with:
          compiler: msvc
          runner_type: ${{ github.event.inputs.runner_type || 'GitHub' }}

      - uses: ./.github/actions/cmake-build/windows
        with:
          compiler: msvc
          build-type: ${{ matrix.build-type }}
          configuration: ${{ matrix.configuration }}

  build_clang:
    needs: info_job
    name: Windows - clang ${{ matrix.build-type }} ${{ matrix.configuration }}
    runs-on: ${{ github.event.inputs.runner_type == 'self-hosted' && fromJson('["self-hosted","Windows"]') || 'windows-latest' }}
    strategy:
      fail-fast: true
      matrix:
        build-type: [editor, game]
        configuration: [debug, release]

    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/build-setup/windows
        with:
          compiler: clang
          runner_type: ${{ github.event.inputs.runner_type || 'GitHub' }}

      - uses: ./.github/actions/cmake-build/windows
        with:
          compiler: clang
          build-type: ${{ matrix.build-type }}
          configuration: ${{ matrix.configuration }}

  build_msvc_asan_ubsan:
    needs: [info_job, build_msvc, build_clang]
    name: Windows - msvc ASAN+UBSAN (debug/editor)
    runs-on: ${{ github.event.inputs.runner_type == 'self-hosted' && fromJson('["self-hosted","Windows"]') || 'windows-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/build-setup/windows
        with:
          compiler: msvc
          runner_type: ${{ github.event.inputs.runner_type || 'GitHub' }}

      - name: ASAN+UBSAN build (via cmake-build/windows action)
        uses: ./.github/actions/cmake-build/windows
        with:
          compiler: msvc
          build-type: editor
          configuration: debug
          configure-preset: windows-msvc-editor-asan-ubsan
          build-preset: windows-msvc-debug-editor-asan-ubsan
          test-preset: test-windows-msvc-debug-editor-asan-ubsan

  build_clang_asan_ubsan:
    needs: [info_job, build_msvc, build_clang]
    name: Windows - clang ASAN+UBSAN (profile/editor)
    runs-on: ${{ github.event.inputs.runner_type == 'self-hosted' && fromJson('["self-hosted","Windows"]') || 'windows-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/build-setup/windows
        with:
          compiler: clang
          runner_type: ${{ github.event.inputs.runner_type || 'GitHub' }}

      - name: ASAN+UBSAN build (via cmake-build/windows action)
        uses: ./.github/actions/cmake-build/windows
        with:
          compiler: clang
          build-type: editor
          configuration: profile
          configure-preset: windows-clang-editor-asan-ubsan
          build-preset: windows-clang-profile-editor-asan-ubsan
          test-preset: test-windows-clang-profile-editor-asan-ubsan
          run-tests: false # Skip tests for clang ASAN+UBSAN build as it currently fails

  validate_instrumented:
    needs: check_date
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    name: Windows - MSVC Debug/editor instrumentation validation
    runs-on: ${{ github.event.inputs.runner_type == 'self-hosted' && fromJson('["self-hosted","Windows"]') || 'windows-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-setup/windows
        with:
          compiler: msvc
          runner_type: ${{ github.event.inputs.runner_type || 'GitHub' }}
      - name: Configure instrumented validation
        shell: pwsh
        run: |
          cmake --preset windows-msvc-editor-instrumentation -DBUILD_TESTING_INTERNAL=ON -DRUN_TESTING_INTERNAL=OFF
          if ($LASTEXITCODE -ne 0) { throw "Validation configure failed: $LASTEXITCODE" }
      - name: Save dependency binaries before compiling the engine
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DIVIDE_VCPKG_BINARY_CACHE }}
          key: ${{ env.DIVIDE_VCPKG_CACHE_KEY }}
      - name: Build instrumented validation
        shell: pwsh
        run: |
          cmake --build --preset windows-msvc-debug-editor-instrumentation --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Validation build failed: $LASTEXITCODE" }
      - name: Run instrumented unit tests
        shell: pwsh
        run: |
          ctest --preset test-windows-msvc-debug-editor-instrumentation
          if ($LASTEXITCODE -ne 0) { throw "Validation tests failed: $LASTEXITCODE" }

  output_job:
    needs: [check_date, info_job, build_msvc, build_clang, build_msvc_asan_ubsan, build_clang_asan_ubsan, validate_instrumented]
    if: always()
    runs-on: windows-latest
    steps:
      - name: Retrieve results
        id: results
        shell: pwsh
        run: |
          $msvcResult = "${{ needs.build_msvc.result }}"
          $clangResult = "${{ needs.build_clang.result }}"
          $msvcAsanResult = "${{ needs.build_msvc_asan_ubsan.result }}"
          $clangAsanResult = "${{ needs.build_clang_asan_ubsan.result }}"
          $infoResult = "${{ needs.info_job.result }}"

          $checkResult = "${{ needs.check_date.result }}"
          $validationResult = "${{ needs.validate_instrumented.result }}"
          $results = @($checkResult, $validationResult)
          if ("${{ inputs.validation_only }}" -ne "true") {
            $results += @($msvcResult, $clangResult, $msvcAsanResult, $clangAsanResult, $infoResult)
          }
          if ($results -contains "failure") {
            $status = "Build or Info job failed"
          } elseif ($results -contains "cancelled") {
            $status = "Build or Info job cancelled"
          } elseif ($checkResult -eq "success" -and "${{ needs.check_date.outputs.should_run }}" -eq "false") {
            $status = "Skipped (no recent commits; no build or tests ran)"
          } elseif ($results -contains "skipped") {
            $status = "Required validation unexpectedly skipped"
          } else {
            $status = "Success"
          }
          echo "status=$status" >> $env:GITHUB_OUTPUT

      - name: Generate Build Summary
        shell: pwsh
        run: |
          echo "## Build Summary" >> $env:GITHUB_STEP_SUMMARY
          echo "Status: ${{ steps.results.outputs.status }}" >> $env:GITHUB_STEP_SUMMARY
          echo "MSVC Version: ${{ needs.info_job.outputs.msvc_version }}" >> $env:GITHUB_STEP_SUMMARY
          echo "Clang Version: ${{ needs.info_job.outputs.clang_version }}" >> $env:GITHUB_STEP_SUMMARY
          echo "Instrumented validation: ${{ needs.validate_instrumented.result }}" >> $env:GITHUB_STEP_SUMMARY

      - name: Fail workflow on cancelled/failed dependency jobs
        if: ${{ steps.results.outputs.status != 'Success' && needs.check_date.outputs.should_run != 'false' || needs.check_date.result != 'success' }}
        shell: pwsh
        run: |
          Write-Error "One or more required jobs did not complete successfully: ${{ steps.results.outputs.status }}"
          exit 1
