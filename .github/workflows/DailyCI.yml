name: Daily CI Scheduler

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'Open pull request number to validate'
        required: true
        type: string
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read
  pull-requests: read
  actions: write
  statuses: write

concurrency:
  group: daily-ci-scheduler
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Require the default branch for manual runs
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch }}
        run: |
          echo "::error::Run the daily CI scheduler from the default branch."
          exit 1
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Queue required platform builds
        uses: actions/github-script@v7
        with:
          script: |
            const schedule = require('./.github/scripts/daily-ci.cjs');
            await schedule({ github, context, core });
