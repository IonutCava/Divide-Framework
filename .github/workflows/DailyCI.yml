name: Daily CI Scheduler

on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read
  pull-requests: read
  actions: write
  statuses: write

concurrency:
  group: daily-ci-scheduler
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check master and open PRs for unbuilt commits
        uses: actions/github-script@v7
        with:
          script: |
            const schedule = require('./.github/scripts/daily-ci.cjs');
            await schedule({ github, context, core });
