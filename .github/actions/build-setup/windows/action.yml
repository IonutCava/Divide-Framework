name: 'Windows Build Setup'
description: 'Common build setup steps for Windows builds'

inputs:
  runner_type:
    description: 'Type of runner (GitHub or self-hosted)'
    required: false
    default: 'GitHub'

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/common-config
      id: common-config
      
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - uses: lukka/get-cmake@latest
      with:
        cmakeVersion: ${{ steps.common-config.outputs.cmake-version }}
        ninjaVersion: ${{ steps.common-config.outputs.ninja-version }}
        
    - name: Setup MSVC
      shell: cmd
      run: |
        for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALLDIR=%%I"
        if not defined VSINSTALLDIR exit /b 1
        call "%VSINSTALLDIR%\Common7\Tools\VsDevCmd.bat" -arch=amd64
        for /f "delims=" %%V in ('set') do (
          echo(%%V | findstr /b "=" >nul || >> "%GITHUB_ENV%" echo %%V
        )

    - name: Clean workspace (self-hosted only)
      if: runner.self-hosted
      shell: pwsh
      run: |
        if (Test-Path "${{ github.workspace }}\vcpkg\downloads\tools") {
          Remove-Item -Recurse -Force "${{ github.workspace }}\vcpkg\downloads\tools"
        }

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: 'vcpkg.json'
