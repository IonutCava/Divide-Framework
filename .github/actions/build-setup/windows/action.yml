name: 'Windows Build Setup'
description: 'Common build setup steps for Windows builds'

inputs:
  runner_type:
    description: 'Type of runner (GitHub or self-hosted)'
    required: false
    default: 'GitHub'

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/common-config
      id: common-config
      
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - uses: lukka/get-cmake@latest
      with:
        cmakeVersion: ${{ steps.common-config.outputs.cmake-version }}
        ninjaVersion: ${{ steps.common-config.outputs.ninja-version }}
        
    - name: Setup MSVC
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at '$vswhere'." }

        $vsInstallDir = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if ([string]::IsNullOrWhiteSpace($vsInstallDir)) { throw 'Unable to determine Visual Studio installation path from vswhere.' }

        $vsDevCmd = Join-Path $vsInstallDir 'Common7\Tools\VsDevCmd.bat'
        if (-not (Test-Path $vsDevCmd)) { throw "VsDevCmd.bat not found at '$vsDevCmd'." }

        $envDump = cmd /s /c "`"$vsDevCmd`" -arch=amd64 >nul && set"
        if ($LASTEXITCODE -ne 0) { throw "VsDevCmd initialization failed with exit code $LASTEXITCODE." }

        $envDump | ForEach-Object {
          if (-not [string]::IsNullOrWhiteSpace($_) -and -not $_.StartsWith('=')) {
            $_ >> $env:GITHUB_ENV
          }
        }

    - name: Clean workspace (self-hosted only)
      if: runner.self-hosted
      shell: pwsh
      run: |
        if (Test-Path "${{ github.workspace }}\vcpkg\downloads\tools") {
          Remove-Item -Recurse -Force "${{ github.workspace }}\vcpkg\downloads\tools"
        }

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: 'vcpkg.json'
