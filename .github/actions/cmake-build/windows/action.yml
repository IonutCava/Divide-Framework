name: 'Windows CMake Build'
description: 'Run CMake build and test steps for Windows'

inputs:
  compiler:
    required: true
    description: 'Compiler to use (msvc or clang)'
  build-type:
    required: true
    description: 'Build type (editor or game)'
  configuration:
    required: true
    description: 'Build configuration (debug, release, or profile)'
  configure-preset:
    required: false
    description: 'Optional: explicit CMake configure preset to use (overrides auto-built one)'
  build-preset:
    required: false
    description: 'Optional: explicit CMake build preset to use (overrides auto-built one)'
  test-preset:
    required: false
    description: 'Optional: explicit CMake test preset to use (overrides auto-built one)'
  run-tests:
    required: false
    description: 'Whether to run tests (true/false). Use "false" to skip tests in this job.'
    default: 'true'

runs:
  using: "composite"
  steps:
    - name: Configure (preset override)
      if: ${{ inputs.configure-preset != '' }}
      shell: pwsh
      working-directory: ${{ github.workspace }}/ci-source
      env:
        PRESET: ${{ inputs.configure-preset }}
      run: |
        cmake --preset $env:PRESET
        if ($LASTEXITCODE -ne 0) { throw "Configure failed: $LASTEXITCODE" }

    - name: Configure (default)
      if: ${{ inputs.configure-preset == '' }}
      shell: pwsh
      working-directory: ${{ github.workspace }}/ci-source
      env:
        PRESET: windows-${{ inputs.compiler }}${{ inputs.build-type == 'editor' && '-editor' || '' }}
      run: |
        cmake --preset $env:PRESET
        if ($LASTEXITCODE -ne 0) { throw "Configure failed: $LASTEXITCODE" }

    - name: Save dependency binaries before compiling the engine
      uses: actions/cache/save@v5
      with:
        path: ${{ env.DIVIDE_VCPKG_BINARY_CACHE }}
        key: ${{ env.DIVIDE_VCPKG_CACHE_KEY }}

    - name: Build (preset override)
      if: ${{ inputs.build-preset != '' }}
      shell: pwsh
      working-directory: ${{ github.workspace }}/ci-source
      env:
        PRESET: ${{ inputs.build-preset }}
      run: |
        cmake --build --preset $env:PRESET
        if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }

    - name: Build ${{ inputs.build-type }} in ${{ inputs.configuration }} mode
      if: ${{ inputs.build-preset == '' }}
      shell: pwsh
      working-directory: ${{ github.workspace }}/ci-source
      env:
        PRESET: windows-${{ inputs.compiler }}-${{ inputs.configuration }}${{ inputs.build-type == 'editor' && '-editor' || '' }}
      run: |
        cmake --build --preset $env:PRESET
        if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }

    - name: Test (preset override)
      if: ${{ inputs.run-tests == 'true' && inputs.test-preset != '' }}
      shell: pwsh
      working-directory: ${{ github.workspace }}/ci-source
      env:
        PRESET: ${{ inputs.test-preset }}
      run: |
        ctest --preset $env:PRESET
        if ($LASTEXITCODE -ne 0) { throw "Tests failed: $LASTEXITCODE" }

    - name: Test ${{ inputs.build-type }} in ${{ inputs.configuration }} mode
      if: ${{ inputs.run-tests == 'true' && inputs.test-preset == '' }}
      shell: pwsh
      working-directory: ${{ github.workspace }}/ci-source
      env:
        PRESET: test-windows-${{ inputs.compiler }}-${{ inputs.configuration }}${{ inputs.build-type == 'editor' && '-editor' || '' }}
      run: |
        ctest --preset $env:PRESET
        if ($LASTEXITCODE -ne 0) { throw "Tests failed: $LASTEXITCODE" }
    
    - name: Record build timing
      shell: pwsh
      run: |
        Get-Date -Format "yyyy-MM-dd HH:mm:ss" >> $env:GITHUB_STEP_SUMMARY
        echo "Build completed for ${{ inputs.compiler }}-${{ inputs.build-type }}-${{ inputs.configuration }}" >> $env:GITHUB_STEP_SUMMARY

    - name: Record build metrics
      shell: pwsh
      run: |
        $buildDuration = [math]::Round(($env:GITHUB_ACTION_END_TIME - $env:GITHUB_ACTION_START_TIME).TotalMinutes, 2)
        echo "## Build Metrics" >> $env:GITHUB_STEP_SUMMARY
        echo "* Duration: ${buildDuration} minutes" >> $env:GITHUB_STEP_SUMMARY
        echo "* Configuration: ${{ inputs.configuration }}" >> $env:GITHUB_STEP_SUMMARY
